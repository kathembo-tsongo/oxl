<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C2B4A" />
  <title>OXL · Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F4EE; color: #1C2B4A;
           font-family: Inter, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    svg { width: 56px; height: 56px; }
    h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 1.6rem; margin: 16px 0 8px; }
    p { color: rgba(28, 43, 74, .7); line-height: 1.5; margin: 0 0 20px; }
    button { font: 500 .95rem Inter, system-ui, sans-serif; background: #1C2B4A; color: #fff; border: 0;
             border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#1C2B4A"/><path d="M16 6 26 16 16 26 6 16z" fill="#A3472A"/></svg>
    <h1>You're offline</h1>
    <p>OXL needs a connection to show live offers, matches and trust reports. Check your mobile data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
